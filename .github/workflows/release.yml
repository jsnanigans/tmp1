name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./compact.sh
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest food-analysis-challenge.zip \
            --title "Challenge (latest)" --notes "Build of ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
